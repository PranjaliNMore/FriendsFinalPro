<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lucky Gift Boxes 🎁</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/common.css') }}">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/lucky_boxes.css') }}">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

</head>

<body>

<div class="card">

<h1>
🎁 Lucky Gift Boxes
</h1>

<h2>

{{ username }}, only ONE gift has your surprise!

</h2>

<p>

Choose wisely... ❤️

</p>

<div class="gift-grid">

<div class="gift" onclick="checkGift(1)">
🎁
</div>

<div class="gift" onclick="checkGift(2)">
🎁
</div>

<div class="gift" onclick="checkGift(3)">
🎁
</div>

<div class="gift" onclick="checkGift(4)">
🎁
</div>

</div>

<h2 id="result"></h2>

</div>

<script src="{{ url_for('static', filename='js/common.js') }}"></script>

<script src="{{ url_for('static', filename='js/lucky_boxes.js') }}"></script>

</body>

</html>
