<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tell Me Your Name ❤️</title>

    <!-- Common CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/common.css') }}">

    <!-- Name CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/name.css') }}">

</head>

<body>

<div class="card">

    <div class="emoji">
        🌸
    </div>

    <h1>Hello Beautiful Soul ❤️</h1>

    <h2 id="typing"></h2>

    <form action="/save_name" method="POST">

        <input
            type="text"
            name="username"
            id="username"
            placeholder="Enter Your Beautiful Name"
            autocomplete="off"
            required>

        <button type="submit">

            Continue ✨

        </button>

    </form>

    <p class="bottom-text">

        Every beautiful story begins with a name 💖

    </p>

</div>

<script src="{{ url_for('static', filename='js/common.js') }}"></script>

<script src="{{ url_for('static', filename='js/name.js') }}"></script>

</body>

</html>
